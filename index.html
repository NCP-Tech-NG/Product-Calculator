<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NCP-Tech-NG Product Calculator</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><header><div class="brand">NCP-Tech-NG</div><h1>Product Calculator</h1><p>Calculate product quantities, pricing, discounts, tax and totals.</p></header>
<section class="panel"><div class="toolbar"><button id="add">+ Add Product</button><button id="clear" class="secondary">Clear</button></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Unit Price (₦)</th><th>Total (₦)</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="panel"><div class="summary"><label>Discount (%)<input id="discount" type="number" min="0" max="100" value="0"></label><label>Tax (%)<input id="tax" type="number" min="0" max="100" value="0"></label><div><span>Subtotal</span><strong id="subtotal">₦0.00</strong></div><div><span>Discount</span><strong id="discountAmount">₦0.00</strong></div><div><span>Tax</span><strong id="taxAmount">₦0.00</strong></div><div class="grand"><span>Grand Total</span><strong id="grand">₦0.00</strong></div></div></section>
<footer>© <span id="year"></span> NCP-Tech-NG</footer></main><script src="app.js"></script></body></html>
